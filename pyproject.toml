[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pandaprotein"
version = "2.0.0"
description = "Deep Protein Preparation & Crystallographic Workbench (PDBFixer, PROPKA 3, COOT, MOLE 2.5, HOLE, CHARMM36m/GROMACS & Vina)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Pritam Kumar Panda", email = "pritam@stanford.edu" }
]
keywords = [
    "protein-preparation",
    "structural-biology",
    "molecular-dynamics",
    "gromacs",
    "autodock-vina",
    "propka",
    "coot",
    "pdbfixer",
    "mole",
    "hole",
    "ion-channel",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
    "gemmi>=0.7.0",
    "biopython>=1.84",
    "propka>=3.5.1",
    "rdkit>=2024.3.1",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
]

[project.urls]
Homepage = "https://github.com/pritampanda15/PandaProtein"
Repository = "https://github.com/pritampanda15/PandaProtein"
Issues = "https://github.com/pritampanda15/PandaProtein/issues"

[project.scripts]
pandaprotein = "pandaprotein.cli:main"

[tool.setuptools]
package-dir = { "pandaprotein" = "backend" }
packages = ["pandaprotein", "pandaprotein.engines"]
include-package-data = true

[tool.setuptools.package-data]
pandaprotein = [
    "samples/*.pdb",
    "static/*",
    "static/assets/*",
]
